<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grid Monster RPG (Modular)</title>
  <style>
    :root{ --bg:#0b0f14; --text:#e9f1ff; --muted:#9db0c9; --shadow: rgba(0,0,0,.45); }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;}
    body{display:grid;place-items:center;overflow:hidden;}
    canvas{image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 18px 60px var(--shadow); border-radius: 18px;}
    .hint{
      position:fixed;left:12px;bottom:12px;max-width:min(820px,92vw);
      background:rgba(18,26,36,.88);backdrop-filter: blur(8px);
      border:1px solid rgba(255,255,255,.08);
      padding:10px 12px;border-radius:14px;color:var(--muted);font-size:13px;line-height:1.35;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      user-select:none;
    }
    .hint b{color:var(--text)}
    .hint kbd{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;padding:1px 6px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--text)}
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="hint">
    <b>Controls:</b> <kbd>WASD</kbd>/<kbd>Arrows</kbd> move (hold) · <kbd>Shift</kbd> sprint ·
    <kbd>Z</kbd>/<kbd>Enter</kbd> confirm / interact · <kbd>X</kbd>/<kbd>Esc</kbd> back · <kbd>Space</kbd> fast text
    <br/>
    <b>Tip:</b> Choose a starter, then head from <b>Town A</b> to <b>Town B</b> → <b>Town C</b> (Dojo) → <b>Town D</b> → <b>Metro City</b>.
  </div>

  <script src="./js/util/rng.js"></script>
  <script src="./js/util/math.js"></script>
  <script src="./js/systems/input.js"></script>
  <script src="./js/systems/audio.js"></script>
  <script src="./js/systems/types.js"></script>
  <script src="./js/data/moves.js"></script>
  <script src="./js/data/monsters.js"></script>
  <script src="./js/world/worldgen.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
